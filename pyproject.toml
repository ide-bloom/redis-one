[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-one"
version = "0.1.0"
description = "A small Redis-compatible server built with asyncio"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
redis-one = "redis_one.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
